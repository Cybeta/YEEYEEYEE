name: 发布 Web 镜像到 Docker Hub

# 发布 Release 时自动构建并推送；也可以在 Actions 里手动运行并指定已有 tag。
# 需要在仓库 Secrets 配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名/命名空间
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（需要写权限，不要用账号密码）
# 可选仓库变量：
#   DOCKERHUB_REPOSITORY  完整镜像名，默认 <DOCKERHUB_USERNAME>/yeeeyee-web

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 git tag，例如 v0.1.5.5
        required: true
        type: string
      update_latest:
        description: 同时更新 latest 标签
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: 构建并推送
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Docker Hub 凭据
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::请在仓库 Secrets 配置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（Docker Hub 访问令牌，需写权限）"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: 计算镜像标签
        id: version
        shell: bash
        run: |
          raw="${{ github.event.release.tag_name || inputs.tag }}"
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/yeeeyee-web', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.update_latest }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=YEEYEEYEE Web
            org.opencontainers.image.description=YEEYEEYEE Web collaboration service
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入任务摘要
        run: |
          echo "### Docker Hub 镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
