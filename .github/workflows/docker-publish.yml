name: 发布 Web 镜像到 Docker Hub

# 三种触发方式：
#   1) main 分支上有影响 Web 镜像的改动时自动构建并推送（版本号取自桌面工程的 <Version>）；
#   2) 发布 Release 时构建并推送；
#   3) 在 Actions 里手动运行并指定已有 tag。
# 需要在仓库 Secrets 配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名/命名空间
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（需要写权限，不要用账号密码）
# 可选仓库变量：
#   DOCKERHUB_REPOSITORY  完整镜像名，默认 <DOCKERHUB_USERNAME>/yeeyeeyee-web

on:
  push:
    branches: [main]
    # 只有真正改变镜像内容的路径才触发：Web 后端、前端、被引用的共享库、
    # 桌面端 Agent 脚本（Web 把它们作为 EmbeddedResource 嵌入）以及 Dockerfile。
    paths:
      - 'YEEYEEYEE.Canvas/**'
      - 'YEEYEEYEE.Web/**'
      - 'YEEYEEYEE.Core/**'
      - 'YEEYEEYEE.Host/**'
      - 'YEEYEEYEE.Desktop.Core/**'
      - 'YEEYEEYEE.Desktop.Shared/**'
      - 'YEEYEEYEE.Desktop.Avalonia/Agent/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 git tag，例如 v0.1.5.5
        required: true
        type: string
      update_latest:
        description: 同时更新 latest 标签
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 连续推送时只保留最新一次构建，避免两个 job 同时往同一个 tag 推送。
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  publish:
    name: 构建并推送
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Docker Hub 凭据
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::请在仓库 Secrets 配置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（Docker Hub 访问令牌，需写权限）"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: 计算镜像标签
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 自动构建的版本号以桌面工程的 <Version> 为唯一来源：Web 不单独维护版本号，
            # 镜像版本与桌面端产品版本保持一致。
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' \
              YEEYEEYEE.Desktop.Avalonia/YEEYEEYEE.Desktop.Avalonia.csproj | head -n1)
          else
            raw="${{ github.event.release.tag_name || inputs.tag }}"
            version="${raw#v}"
          fi
          if [ -z "$version" ]; then
            echo "::error::无法确定版本号：检查桌面工程里的 <Version> 或手动输入的 tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/yeeyeeyee-web', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || inputs.update_latest }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=YEEYEEYEE Web
            org.opencontainers.image.description=YEEYEEYEE Web collaboration service
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入任务摘要
        run: |
          echo "### Docker Hub 镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
